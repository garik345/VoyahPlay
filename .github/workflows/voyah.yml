name: DiPlay Voyah preview
on:
  workflow_dispatch:
  push:
    branches: [voyah-free-v0.1]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Check public source
        run: python3 scripts/check_public_tree.py
      - name: Test Voyah and build identity-free preview
        run: ./gradlew :common:testDebugUnitTest --tests 'com.shilapi.xcertplay.voyah.*' :mobile:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Voyah-0.1.1-preview-no-CarPlay-identity
          path: mobile/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Voyah-test-results
          path: common/build/reports/tests/
